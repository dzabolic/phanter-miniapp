<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Phanter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- CSS escrito em "u" = 1 pixel do seu design de 1170px de largura. O script abaixo converte para a tela real. -->
<script type="text/plain" id="css">
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#111}
button,input,textarea{font-family:inherit}
.app{max-width:480px;margin:0 auto;container-type:inline-size}
.stage{--u:calc(100cqw/1170);position:relative;min-height:2532u;background-repeat:no-repeat;background-size:100% auto;background-position:bottom center;font-family:'Poppins',sans-serif}

/* PÁGINA 1 */
.home{background-color:#6B8A9E;background-image:url(bg1.jpg);padding:700u 147u 0 165u;color:#fff}
.lbl{margin:0 0 8u;font-size:32u;line-height:48u;font-weight:300;text-transform:uppercase}
.lbl.b{margin-top:45u}
.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:24u}
.chip,.opt{border:3u solid #9DB4C4;border-radius:10u;background:#566E82;color:#fff;font-size:30u;font-weight:300;cursor:pointer;padding:0}
.chip{height:56u;text-transform:uppercase}
.opt{display:flex;align-items:center;gap:30u;width:100%;height:56u;margin-bottom:23u;padding:0 20u;text-align:left}
.opt i{width:28u;height:28u;border-radius:50%;background:#B2C7D6;flex:none}
.chip.sel,.opt.sel{background:#B2C7D6;color:#2F4557}
.opt.sel i{background:#566E82}

/* PÁGINA 2 */
.menu{background-color:#D0D8CC;background-image:url(bg2.jpg);padding:490u 96u 1080u 84u;color:#000}
.msec+.msec{margin-top:163u}
.mlbl{margin:0 0 17u 6u;font-size:32u;line-height:46u;font-weight:300;text-transform:uppercase}
.mlbl b{font-weight:700}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:25u 18u}
.mb{height:69u;border:0;border-radius:20u;background:#480E2D;color:#D0D8CC;font-size:36u;font-weight:700;text-transform:uppercase;cursor:pointer;padding:0 10u}
.mgrid .mb:last-child:nth-child(odd){grid-column:1/-1}
.back{display:block;margin:121u auto 0;border:0;background:none;color:#480E2D;font-size:30u;font-weight:600;text-transform:uppercase;cursor:pointer}

/* PÁGINA 3 */
.form{background-color:#FFEBCC;background-image:url(bg3.jpg);padding:520u 119u 1040u 107u;color:#000}
.fld{margin-bottom:60u}
.fl{margin:0 0 8u 3u;font-size:30u;line-height:36u;font-weight:500;text-transform:uppercase}
.in,.fbar{display:flex;align-items:center;width:100%;min-height:81u;border:0;border-radius:25u;background:#467A1F;color:#FFEBCC;font-size:30u;padding:0 36u;outline:0}
textarea.in{display:block;height:260u;padding:26u 36u;resize:none}
.in::placeholder{color:rgba(255,235,204,.6)}
.fbar{cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:18u}
.cb{min-height:81u;border:0;border-radius:25u;background:#467A1F;color:#FFEBCC;font-size:30u;padding:0 36u;cursor:pointer}
.cb.on{background:#12300F}
.note{margin:0;font-size:26u;line-height:34u}
.send{display:block;margin:108u auto 0;width:335u;height:78u;border:0;border-radius:12u;background:#12300F;color:#FFEBCC;font-size:36u;font-weight:500;text-transform:uppercase;cursor:pointer}
.send:disabled{opacity:.6}

/* PÁGINA 4 */
.thanks{background-color:#6A756C;background-image:url(bg4.jpg);padding:680u 202u 0 199u;color:#fff}
.thanks h1{margin:0;font-size:140u;line-height:1;font-weight:700;letter-spacing:-.05em;color:#BCC0BE;text-transform:uppercase}
.thanks p{margin:42u 0 0;font-size:30u;line-height:36u;text-align:justify}
.btns{display:flex;justify-content:space-between;margin:110u 38u 0 29u}
.tb{width:215u;height:50u;border:0;border-radius:8u;background:#1F2F3A;color:#fff;font-size:28u;text-transform:uppercase;cursor:pointer}
</script>
</head>
<body>
<div class="app" id="app"></div>
<script>
const st=document.createElement('style');
st.textContent=document.getElementById('css').textContent.replace(/(\d+(?:\.\d+)?)u\b/g,'calc($1*var(--u))');
document.head.appendChild(st);

const tg=window.Telegram&&Telegram.WebApp;
if(tg){tg.ready();tg.expand();}
const $app=document.getElementById('app');
const warn=m=>tg?tg.showAlert(m):alert(m);

/* ===== CONFIGURAÇÃO (edite aqui) ===== */
const N={spotify:'Spotify',amazon:'Amazon',billboard:'Billboard',deezer:'Deezer',empire:'Empire Records',selvari:'Selvari (agência)',hbo:'HBO',netflix:'Netflix',calvinklein:'Calvin Klein',versace:'Versace',dior:'Dior',ciroc:'Ciroc',absolut:'Absolut',saturn:'Saturn',vivalatino:'Viva Latino',fader:'The Fader',spotifynews:'Spotify Newsroom'};
const EMB=['dior','versace','ciroc','absolut','calvinklein'];
const SEC={ // profissão -> seções da página 2: [formulário, título, empresas]
  cantor:[['artista','Como <b>artista verificado</b>:',['spotify','amazon','billboard','deezer','empire','selvari']],['embaixador','Como <b>embaixador</b>:',EMB]],
  ator:[['ator','Como <b>ator contratado</b>:',['amazon','selvari','hbo','netflix']],['embaixador','Como <b>embaixador</b>:',EMB]],
  modelo:[['modelo','Como <b>modelo</b>:',['calvinklein','versace','dior','selvari']],['embaixador','Como <b>embaixador</b>:',['ciroc','absolut']]],
  atleta:[['atleta','Como <b>atleta</b>:',['selvari']],['embaixador','Como <b>embaixador</b>:',EMB]]
};
const PL=['spotify','saturn','billboard','selvari','vivalatino'];
const SHAPE='Adicione duas fotos do seu shape (fotos de photoshoot e fundo único, selfies não são permitidas):';
const CAN='@ do seu canal profissional',PES='Seu @ pessoal',SH='Nome e @ do seu shape';
const M2={min:2,max:2,img:1,l:SHAPE};
const F={ // campos: [rótulo, tipo] (tipo: vazio=texto, 'l'=texto longo, 'yn'=sim/não, 'co'=empresas)
  artista:{f:[['Nome artístico'],[CAN],[PES],[SH]],m:M2},
  ator:{f:[['Nome artístico'],[CAN],[PES],[SH]],m:M2},
  modelo:{f:[['Nome'],[CAN],[PES],[SH],['Caso precisemos que você use um shape dual na campanha, está disposto?','yn']],m:M2},
  atleta:{f:[['Nome (coloque também o apelido de atleta, se tiver)'],['Seu esporte'],[CAN],[PES],[SH]],m:M2},
  embaixador:{f:[['Nome'],['Profissão'],[CAN],[PES],[SH]],m:M2},
  playlist:{f:[['Nome da sua música'],[PES],[CAN],['Em quais playlists sua música pode entrar?','co']],m:{min:2,max:2,img:1,l:'Adicione duas fotos: do clipe da música ou da capa do single:'}},
  noticia:{f:[['Qual é o assunto da notícia?'],['Escreva a legenda da notícia','l'],['Informe os @ a serem marcados no post (pessoal ou do canal)']],m:{min:1,max:5,img:0,l:'Adicione as mídias (no máximo 5, e com qualidade, por gentileza):'},note:'OBS: Assim que o post for feito, pedimos que mandem em grupos de desflop para ajudar a página. Agradecemos a preferência!'}
};
const OBJ=[['contrato','ser contratado/entrar em uma base'],['alcance','ter mais alcance/divulgar um trabalho específico']];

/* ===== NAVEGAÇÃO ===== */
const S={prof:null,obj:null,menuFn:null,menuHist:[]};
let cur=null,hist=[];
function sync(){if(tg)hist.length?tg.BackButton.show():tg.BackButton.hide();}
function mark(f){if(f.menu){S.menuFn=f;S.menuHist=hist.slice();}}
function show(fn,push=true){if(push&&cur)hist.push(cur);cur=fn;mark(fn);fn();scrollTo(0,0);sync();}
function back(){const f=hist.pop();if(f){cur=f;mark(f);f();scrollTo(0,0);sync();}}
if(tg)tg.BackButton.onClick(back);
function paint(cls,bg,html){
  $app.innerHTML=`<div class="stage ${cls}">${html}</div>`;
  try{if(tg){tg.setHeaderColor(bg);tg.setBackgroundColor(bg);}}catch(e){}
}
function goHome(){S.prof=S.obj=null;S.menuFn=null;hist=[];cur=null;show(home,false);}

/* PÁGINA 1 */
function home(){
  paint('home','#6B8A9E',
   `<p class="lbl">Sua profissão:</p><div class="row4">${['cantor','ator','modelo','atleta'].map(p=>`<button class="chip" data-p="${p}">${p}</button>`).join('')}</div>
    <p class="lbl b">O que você procura?</p>${OBJ.map(([k,t])=>`<button class="opt" data-o="${k}"><i></i>${t}</button>`).join('')}`);
  const upd=()=>{
    $app.querySelectorAll('[data-p]').forEach(b=>b.classList.toggle('sel',b.dataset.p===S.prof));
    $app.querySelectorAll('[data-o]').forEach(b=>b.classList.toggle('sel',b.dataset.o===S.obj));
  };
  const go=()=>{upd();if(S.prof&&S.obj)setTimeout(()=>{S.menuFn=null;show(next());},250);};
  $app.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{S.prof=b.dataset.p;go();}); // só uma profissão por vez
  $app.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{S.obj=b.dataset.o;go();});
  upd();
}
function next(){
  if(S.obj==='contrato')return menu(SEC[S.prof].map(([fk,l,cs])=>({l,items:cs.map(c=>[N[c],()=>show(formView(fk,c))])})));
  if(S.prof!=='cantor')return formView('noticia','fader');
  const news=menu([{l:'Publique sua <b>notícia</b> em:',items:['fader','spotifynews'].map(c=>[N[c],()=>show(formView('noticia',c))])}]);
  return menu([{l:'Como você quer ter <b>mais alcance</b>?',items:[['Tenha sua música em nossas playlists',()=>show(formView('playlist'))],['Publique uma notícia sobre seu trabalho',()=>show(news)]]}]);
}

/* PÁGINA 2 */
function menu(secs){
  const fn=()=>{
    paint('menu','#D0D8CC',secs.map((s,si)=>`<div class="msec"><p class="mlbl">${s.l}</p><div class="mgrid">${s.items.map((it,i)=>`<button class="mb" data-s="${si}" data-i="${i}">${it[0]}</button>`).join('')}</div></div>`).join('')+`<button class="back" id="bk">‹ Voltar</button>`);
    $app.querySelectorAll('.mb').forEach(b=>b.onclick=()=>secs[b.dataset.s].items[b.dataset.i][1]());
    document.getElementById('bk').onclick=back;
  };
  fn.menu=true;return fn;
}

/* PÁGINA 3 */
function formView(fk,comp){
  const d=F[fk];
  return()=>{
    let files=[];const yn={},sel=new Set();
    const lab=l=>/\?$/.test(l)?l:l+':';
    let h=d.f.map(([l,t],i)=>{
      let c;
      if(t==='l')c=`<textarea class="in" data-i="${i}"></textarea>`;
      else if(t==='yn')c=`<div class="chips">${['Sim','Não'].map(v=>`<button type="button" class="cb" data-yn="${i}" data-v="${v}">${v}</button>`).join('')}</div>`;
      else if(t==='co')c=`<div class="chips">${PL.map(k=>`<button type="button" class="cb" data-co="${k}">${k==='selvari'?'Selvari Music':N[k]}</button>`).join('')}</div>`;
      else c=`<input class="in" data-i="${i}" autocomplete="off">`;
      return `<div class="fld"><p class="fl">${lab(l)}</p>${c}</div>`;
    }).join('');
    h+=`<div class="fld"><p class="fl">${d.m.l}</p><label class="fbar" id="fb"><span id="ft">Toque para escolher</span><input type="file" id="fi" hidden multiple accept="${d.m.img?'image/*':'image/*,video/*'}"></label></div>`;
    if(d.note)h+=`<p class="note">${d.note}</p>`;
    h+=`<button class="send" id="send">Enviar ›</button>`;
    paint('form','#FFEBCC',h);

    $app.querySelectorAll('[data-yn]').forEach(b=>b.onclick=()=>{yn[b.dataset.yn]=b.dataset.v;$app.querySelectorAll(`[data-yn="${b.dataset.yn}"]`).forEach(x=>x.classList.toggle('on',x===b));});
    $app.querySelectorAll('[data-co]').forEach(b=>b.onclick=()=>{const k=b.dataset.co;sel.has(k)?sel.delete(k):sel.add(k);b.classList.toggle('on',sel.has(k));});
    document.getElementById('fi').onchange=e=>{
      let a=[...e.target.files];
      const ok=a.filter(f=>(f.type.startsWith('image/')&&f.size<=10e6)||(!d.m.img&&f.type.startsWith('video/')&&f.size<=45e6));
      if(ok.length<a.length)warn('Alguns arquivos foram ignorados: fotos até 10 MB'+(d.m.img?'.':' e vídeos até 45 MB.'));
      if(ok.length>d.m.max)warn(`Máximo de ${d.m.max} arquivo(s).`);
      files=ok.slice(0,d.m.max);
      document.getElementById('ft').textContent=files.length?`✓ ${files.length} arquivo(s) selecionado(s)`:'Toque para escolher';
    };
    const btn=document.getElementById('send');
    btn.onclick=async()=>{
      const ans=[],dest=[];
      for(let i=0;i<d.f.length;i++){
        const [l,t]=d.f[i];
        if(t==='co'){if(!sel.size)return warn('Escolha ao menos uma playlist.');dest.push(...sel);continue;}
        const v=t==='yn'?yn[i]:$app.querySelector(`[data-i="${i}"]`).value.trim();
        if(!v)return warn('Preencha todos os campos: '+l.replace(/\?$/,''));
        ans.push([l.replace(/\?$/,''),v]);
      }
      if(!dest.length)dest.push(comp);
      if(files.length<d.m.min)return warn(d.m.min>1?`Envie ${d.m.min} fotos.`:'Envie ao menos 1 mídia.');
      const fd=new FormData();
      fd.append('initData',tg?tg.initData:'');fd.append('form',fk);
      fd.append('companies',JSON.stringify(dest));fd.append('answers',JSON.stringify(ans));
      files.forEach(f=>fd.append('files',f));
      btn.disabled=true;btn.textContent='Enviando…';
      try{
        const r=await fetch('/api/submit',{method:'POST',body:fd});
        const j=await r.json().catch(()=>({}));
        if(!r.ok||!j.ok)throw new Error(j.error||'falha no envio');
        show(thanksView(fk));
      }catch(e){warn('Não foi possível enviar: '+e.message);btn.disabled=false;btn.textContent='Enviar ›';}
    };
  };
}

/* PÁGINA 4 */
function thanksView(fk){
  return()=>{
    hist=[];
    const txt=fk==='noticia'
      ?'sua notícia foi enviada para a nossa equipe. Assim que o post for feito, mande nos grupos de desflop para ajudar a página. Agradecemos a preferência!'
      :'você acaba de preencher o formulário para fazer parte da nossa empresa. Fique atento às mensagens da <b>CEO</b> (@DZABOLIC) para confirmar a sua entrada. Esperamos que goste da estadia conosco. Até lá!';
    paint('thanks','#6A756C',`<h1>Obrigado!</h1><p>${txt}</p><div class="btns"><button class="tb" id="tv">‹ Voltar</button><button class="tb" id="th">Home</button></div>`);
    document.getElementById('th').onclick=goHome;
    document.getElementById('tv').onclick=()=>{ // volta para a lista de empresas (página 2); sem lista, vai para o início
      if(!S.menuFn)return goHome();
      hist=S.menuHist.slice();cur=S.menuFn;S.menuFn();scrollTo(0,0);sync();
    };
  };
}

show(home,false);
</script>
</body>
</html>
